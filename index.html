<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="landing">
      <nav>
        <select onchange="filterCharacters(event)">
          <option value="">Sort</option>
          <option value="HIGH_TO_LOW">Highest to Lowest</option>
          <option value="LOW_TO_HIGH">Lowest to Highest</option>
        </select>
      </nav>
      <div class="search_wrap">
        <input
          type="text"
          id="search"
          placeholder="Search Dragon Ball characters..."
          oninput="searchCharacters(event)"
        />

        <div id="items"></div>
      </div>
    </section>
    <section id="items">
      <div class="name">name</div>
      <div class="object_wrap">
        <figure>
          <img src="" alt="" />
        </figure>
        <h1>ki</h1>
        <div class="stats_wrap">
          <h2 class="object_stat">maxKi</h2>
          <h2 class="object_stat">race</h2>
          <h2 class="object_stat">gender</h2>
          <h2 class="object_stat">desciption</h2>
          <h2 class="object_stat">image</h2>
          <h2 class="object_stat">affiliaiton</h2>
        </div>
      </div>
    </section>

    <footer>
      <div class="footer_links">
        <ol>
          <a href="">Dragonball</a>
        </ol>
        <ol>
          <a href="">Dragonball Z</a>
        </ol>
        <ol>
          <a href="">Dragonball GT</a>
        </ol>
      </div>
      <div class="copyright_wrap">
        <div class="copyright">Copyright © by Al Ford 2026</div>
      </div>
    </footer>

    <script src="index.js"></script>
  </body>
</html>
