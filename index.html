<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragonball-Z Characters</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav>
      <h1>Dragonball-Z</h1>

      <div class="nav_links">
        <a href="#">Home</a>
        <a href="#characters">Characters</a>
        <a href="#footer">About</a>
      </div>
    </nav>

    <section id="landing">
      <div class="search_wrap">
        <select onchange="filterCharacters(event)">
          <option value="">Sort</option>
          <option value="HIGH_TO_LOW">Highest to Lowest</option>
          <option value="LOW_TO_HIGH">Lowest to Highest</option>
        </select>

        <input
          type="text"
          id="search"
          placeholder="Search Dragon Ball characters..."
          oninput="searchCharacters(event)"
        />
      </div>
    </section>

    <section id="characters">
      <div id="items"></div>
    </section>

    <footer id="footer">
      <div class="footer_links">
        <a href="#">Dragonball</a>
        <a href="#">Dragonball Z</a>
        <a href="#">Dragonball GT</a>
      </div>

      <p class="copyright">Copyright © by Al Ford 2026</p>
    </footer>

    <script src="index.js"></script>
  </body>
</html>
